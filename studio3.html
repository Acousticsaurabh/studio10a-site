<title>Moises Prompt Machine · Studio 10A</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Mulish:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --gold:#FCBA00; --blue:#41608F; --ink:#0B0D11; --page:#14181E; --card:#1A1F27; --sunk:#0F1319;
  --text:#ECEFE9; --soft:#98A29B; --faint:#6B746E; --rule:#2A313A; --on-gold:#0B0D11;
  --moi:#20C5D6; --moibg:#101316; --moitile:#1B1E22; --moion:#2B2F35;
  --body:Mulish,"Avenir Next",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; --fh:200;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ink:#E6E8E2; --page:#FBFBF9; --card:#FFFFFF; --sunk:#F0F0EA;
  --text:#14181E; --soft:#5A6360; --faint:#8A928D; --rule:#D6D9D2;
  --moi:#0E8F9C; --moibg:#F3F5F6; --moitile:#FFFFFF; --moion:#E2E7EA;
}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:var(--sunk)}
*::-webkit-scrollbar-corner{background:var(--sunk)}
*::-webkit-scrollbar-thumb{background:var(--rule);border-radius:7px;border:2px solid var(--sunk)}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}
*{scrollbar-width:thin;scrollbar-color:var(--rule) var(--sunk)}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none} input,textarea,select{font:inherit}
.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100dvh}

header{display:flex;align-items:center;gap:.85rem;padding:.55rem clamp(.7rem,2vw,1.3rem);
  background:linear-gradient(180deg,var(--page),var(--ink));border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{flex:0 0 auto;display:block;line-height:0;cursor:pointer}
.brand:hover{opacity:.85}
.wm{height:46px;width:auto;display:block}
.wm.light{display:none}
:root[data-theme="light"] .wm.dark{display:none}
:root[data-theme="light"] .wm.light{display:block}
.ttl{text-align:left;cursor:pointer;font-weight:800;font-size:clamp(.92rem,2.2vw,1.2rem);letter-spacing:-.015em;
  padding-left:.85rem;border-left:1px solid var(--rule);min-width:0}
.ttl em{font-style:normal;font-weight:900;color:var(--gold)}
.ttl:hover em{text-decoration:underline;text-underline-offset:3px}
.ttl s{display:block;text-decoration:none;font-family:var(--mono);font-size:.52rem;letter-spacing:.15em;
  color:var(--faint);text-transform:uppercase;margin-top:.1rem}
.tools{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.srch{position:relative}
.srch input{background:var(--sunk);border:1px solid var(--rule);border-radius:2rem;color:var(--text);
  padding:.44rem .9rem .44rem 2rem;width:min(15rem,42vw);font-size:.82rem;outline:none}
.srch input:focus{border-color:var(--gold)}
.srch::before{content:"⌕";position:absolute;left:.72rem;top:50%;transform:translateY(-52%);color:var(--faint)}
.tbtn{border:1px solid var(--rule);border-radius:2rem;padding:.4rem .8rem;font-size:.75rem;font-weight:700;
  background:var(--sunk);white-space:nowrap}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}
.tbtn.danger:hover{border-color:#E36A6A;color:#E36A6A}

.modebar{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
  padding:.5rem clamp(.7rem,2vw,1.3rem);background:var(--sunk);border-bottom:1px solid var(--rule)}
.mlabel{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.mode{border:1px solid var(--rule);background:var(--card);border-radius:.5rem;padding:.42rem .95rem;
  font-size:.82rem;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:.45rem}
.mode i{font-style:normal;font-size:.95rem;line-height:1}
.mode:hover{color:var(--text);border-color:var(--gold)}
.mode[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:flex;border:1px solid var(--rule);border-radius:.5rem;overflow:hidden;margin-left:.4rem}
.seg button{padding:.38rem .75rem;font-size:.74rem;font-weight:800;color:var(--soft);background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.mnote{font-size:.72rem;color:var(--faint);margin-left:auto;max-width:30rem;text-align:right}
@media(max-width:56rem){ .mnote{display:none} }

.ctx{background:var(--sunk);border-bottom:1px solid var(--rule);padding:0 clamp(.7rem,2vw,1.3rem)}
.ctx summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.7rem;padding:.45rem 0;font-size:.78rem}
.ctx summary::-webkit-details-marker{display:none}
.ctx summary::before{content:"\25B8";color:var(--faint);font-size:.7rem}
.ctx[open] summary::before{content:"\25BE"}
.ltag{font-family:var(--mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.lstate{color:var(--faint);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lstate.on{color:var(--gold);font-weight:700}
.ctxbody{padding:.1rem 0 .7rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .5rem}
.chip{border:1px solid var(--rule);border-radius:2rem;padding:.24rem .66rem;font-size:.73rem;font-weight:700;
  color:var(--soft);background:var(--card)}
.chip:hover{border-color:var(--gold);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.chip.flip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.ctxrow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.ctxrow input[type=text]{flex:1 1 16rem;background:var(--card);border:1px solid var(--rule);border-radius:.45rem;
  color:var(--text);padding:.45rem .6rem;font-family:var(--mono);font-size:.76rem}
.ctxrow input:focus{outline:none;border-color:var(--gold)}
.hint{font-size:.72rem;color:var(--faint)}
.sw{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:700;color:var(--soft);cursor:pointer}
.sw input{accent-color:var(--gold)}

.main{display:grid;grid-template-columns:14rem minmax(0,1fr);min-height:0}
@media(max-width:60rem){ .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)} }
.rail{background:var(--page);border-right:1px solid var(--rule);overflow:auto;padding:.6rem .5rem 8rem}
@media(max-width:60rem){ .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;gap:.4rem;
  overflow-x:auto;padding:.55rem .6rem;scrollbar-width:none} .rail::-webkit-scrollbar{display:none} .railhead{display:none} }
.railhead{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);padding:.7rem .6rem .35rem}
.fam{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.48rem .6rem;
  border-radius:.5rem;font-size:.84rem;font-weight:700;color:var(--soft);white-space:nowrap;border:1px solid transparent}
.fam .dot{width:.62rem;height:.62rem;border-radius:50%;background:hsl(var(--fh) 40% 46%);flex:0 0 auto;
  box-shadow:0 0 0 3px hsl(var(--fh) 40% 46% / .16)}
.fam .n{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.fam:hover{background:var(--sunk);color:var(--text)}
.fam[aria-pressed="true"]{background:hsl(var(--fh) 40% 44% / .14);color:var(--text);border-color:hsl(var(--fh) 40% 46% / .45)}
.fam.dim{opacity:.35}
.fam.build .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(252,186,0,.18)}
@media(max-width:60rem){ .fam{width:auto;flex:0 0 auto;background:var(--sunk)} .fam .n{display:none} }

.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,29rem);min-height:0}
@media(max-width:78rem){ .content{grid-template-columns:minmax(0,1fr)} }
.list{overflow:auto;padding:.9rem clamp(.7rem,2vw,1.2rem) 9rem;min-width:0}
.intro{font-size:.8rem;color:var(--soft);margin:0 0 .9rem;max-width:52rem}
.intro b{color:var(--text)}
.groupbar{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .9rem}
.gchip{border:1px solid var(--rule);border-radius:2rem;padding:.28rem .72rem;font-size:.74rem;font-weight:700;
  color:var(--soft);background:var(--sunk)}
.gchip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-left:4px solid hsl(var(--fh) 40% 46%);border-radius:.6rem;padding:.7rem .8rem .75rem;
  transition:transform .12s ease,border-color .12s ease}
.card:hover{transform:translateY(-2px);border-color:hsl(var(--fh) 40% 46%)}
.card[aria-pressed="true"]{outline:2px solid hsl(var(--fh) 40% 46%);outline-offset:1px}
.card h3{margin:0;font-size:.94rem;font-weight:800;letter-spacing:-.01em;padding-right:1.2rem}
.card p{margin:.25rem 0 0;font-size:.76rem;color:var(--soft);line-height:1.4}
.meta{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem;align-items:center}
.tier,.btnb{display:inline-block;font-family:var(--mono);font-size:.53rem;letter-spacing:.13em;
  text-transform:uppercase;padding:.16rem .45rem;border-radius:.3rem;font-weight:600}
.btnb{background:transparent;border:1px solid var(--rule);color:var(--soft)}
.t-native{background:#1E3A55;color:#8FC6EF} .t-lineage{background:#1E4D36;color:#8FE3B4}
.t-describe{background:#4A3714;color:#F0C878} .t-test{background:#4D2424;color:#F2A3A3}
.t-recipe{background:#2A313A;color:#C6CDC8} .t-custom{background:#3A2E52;color:#C9A8F0}
:root[data-theme="light"] .t-native{background:#DEEBF7;color:#1D4B72}
:root[data-theme="light"] .t-lineage{background:#DCF2E6;color:#1B5B3C}
:root[data-theme="light"] .t-describe{background:#F8ECD2;color:#7A5410}
:root[data-theme="light"] .t-test{background:#F8DEDE;color:#8A2B2B}
:root[data-theme="light"] .t-recipe{background:#E7E9E4;color:#3E4541}
:root[data-theme="light"] .t-custom{background:#EFE3FA;color:#5B3A82}
.star{position:absolute;top:.45rem;right:.5rem;font-size:.95rem;line-height:1;color:var(--faint);padding:.1rem .2rem;border-radius:.3rem}
.star:hover,.star.on{color:var(--gold)}

.detail{background:var(--page);border-left:1px solid var(--rule);overflow:auto;padding:1rem 1rem 9rem}
@media(max-width:78rem){ .detail{position:fixed;inset:auto 0 0 0;height:86dvh;border-left:0;
  border-top:2px solid hsl(var(--fh) 40% 46%);border-radius:1rem 1rem 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5);
  transform:translateY(101%);transition:transform .22s ease;z-index:40} .detail.open{transform:none} }
.dclose{display:none}
@media(max-width:78rem){ .dclose{display:block;position:sticky;top:0;margin-left:auto;font-size:1.4rem;
  line-height:1;color:var(--faint);padding:0 .2rem;z-index:2} }
.empty{color:var(--faint);font-size:.84rem;text-align:center;padding:3rem 1rem;font-family:var(--mono)}
.dkick{font-family:var(--mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:hsl(var(--fh) 40% 52%)}
.detail h2{font-weight:800;font-size:1.32rem;margin:.25rem 0 .1rem;line-height:1.15;letter-spacing:-.015em}
.dsub{font-size:.8rem;color:var(--soft);margin:.3rem 0 .9rem}
.tip{font-size:.76rem;color:var(--soft);background:hsl(var(--fh) 38% 44% / .1);
  border:1px solid hsl(var(--fh) 38% 44% / .3);border-radius:.5rem;padding:.55rem .7rem;margin:0 0 .7rem}
.tip b{color:var(--text)}
.tip.flipnote{background:rgba(65,96,143,.12);border-color:rgba(65,96,143,.4)}
.tip.note{background:rgba(252,186,0,.07);border-color:rgba(252,186,0,.3)}
.recipe{font-size:.8rem;line-height:1.6;white-space:pre-wrap;background:var(--sunk);border:1px solid var(--rule);
  border-radius:.55rem;padding:.75rem .85rem;margin:0 0 .7rem}
.recipe b{color:var(--gold)}

/* the Moises panel, drawn the way it looks inside Studio Pro */
.moi{background:var(--moibg);border:1px solid var(--rule);border-radius:.7rem;padding:.7rem;margin:0 0 .7rem}
.moihead{display:flex;align-items:center;gap:.5rem;margin:0 0 .55rem;font-size:.8rem;font-weight:700}
.moihead .wave{color:var(--moi);font-weight:900;letter-spacing:-.05em}
.moihead small{margin-left:auto;font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.moigrid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin:0 0 .45rem}
.mt{background:var(--moitile);border:1px solid transparent;border-radius:.4rem;padding:.42rem .6rem;font-size:.76rem;
  color:var(--faint);text-align:left;display:flex;align-items:center;gap:.45rem}
.mt i{font-style:normal;opacity:.7;font-size:.8rem}
.mt.on{background:var(--moion);color:var(--text);border-color:var(--moi);font-weight:800}
.mt.alt{border-style:dashed;border-color:var(--faint);color:var(--soft)}
button.mt:hover{color:var(--text);border-color:var(--moi)}
.moiseg{display:grid;grid-template-columns:1fr 1fr;background:var(--moitile);border-radius:.4rem;padding:.2rem;margin:0 0 .45rem}
.moiseg span{text-align:center;font-size:.74rem;padding:.3rem;border-radius:.3rem;color:var(--faint)}
.moiseg span.on{background:var(--moion);color:var(--text);font-weight:700}
.moibox{width:100%;min-height:7.5rem;background:var(--moitile);border:1px solid var(--rule);border-radius:.45rem;
  color:var(--text);padding:.6rem .65rem;font-family:var(--mono);font-size:.76rem;line-height:1.55;resize:vertical}
.moibox:focus{outline:none;border-color:var(--moi)}
.lint{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.35rem 0 .45rem;font-size:.7rem}
.wc{font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.wc.warn{color:#F0C878}
.lw{background:rgba(227,106,106,.12);border:1px solid rgba(227,106,106,.35);color:#F2A3A3;border-radius:.35rem;padding:.12rem .45rem}
:root[data-theme="light"] .lw{color:#8A2B2B}
.lok{color:#8FE3B4;font-family:var(--mono);font-size:.62rem}
:root[data-theme="light"] .lok{color:#1B5B3C}
.moiset{border-top:1px solid var(--rule);margin-top:.35rem;padding-top:.5rem}
.setrow{display:flex;align-items:center;justify-content:space-between;font-size:.74rem;color:var(--soft);padding:.16rem 0}
.setrow b{font-family:var(--mono);font-size:.7rem;color:var(--text)}
.setrow b.on{color:var(--moi)}
.bar{flex:0 0 7rem;height:4px;background:var(--moitile);border-radius:2px;position:relative;margin:0 .6rem 0 auto}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--moi);border-radius:2px}
.profs{display:flex;gap:.3rem;flex-wrap:wrap;margin:.1rem 0 .4rem}
.prof{border:1px solid var(--rule);border-radius:2rem;padding:.18rem .6rem;font-size:.68rem;font-weight:800;color:var(--soft);background:var(--moitile)}
.prof[aria-pressed="true"]{background:var(--moi);color:#06222A;border-color:var(--moi)}
.moifoot{display:flex;gap:.45rem;margin-top:.6rem;flex-wrap:wrap}
.cta{flex:1 1 auto;background:var(--gold);color:var(--on-gold);border-radius:.45rem;padding:.55rem .8rem;font-weight:900;font-size:.84rem}
.cta.done{background:#1E4D36;color:#8FE3B4}
.sbtn{border:1px solid var(--rule);border-radius:.45rem;padding:.5rem .7rem;font-size:.74rem;font-weight:800;color:var(--soft);background:var(--card)}
.sbtn:hover{border-color:var(--gold);color:var(--gold)}
.sbtn.on{color:var(--gold);border-color:var(--gold)}

/* builder */
.bgroup{margin:0 0 .6rem}
.blabel{font-family:var(--mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem;display:block}
.form input[type=text],.form textarea,.form select{width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:.45rem;
  color:var(--text);padding:.5rem .6rem;font-size:.82rem;margin:0 0 .6rem}
.form textarea{font-family:var(--mono);font-size:.76rem;line-height:1.55;min-height:4.2rem;resize:vertical}
.form input:focus,.form textarea:focus,.form select:focus{outline:none;border-color:var(--gold)}
.bwrap{max-width:60rem}
.bcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.2rem 1.2rem}

.favdock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,var(--page),var(--sunk));
  border-top:2px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.favhead{display:flex;align-items:center;gap:.6rem;padding:.4rem clamp(.7rem,2vw,1.2rem)}
.favhead b{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.favtoggle{margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--soft);border:1px solid var(--rule);border-radius:.35rem;padding:.16rem .55rem}
.favwrap{display:flex;gap:.45rem;overflow-x:auto;padding:0 clamp(.7rem,2vw,1.2rem) .55rem}
.favdock.closed .favwrap{display:none}
.fav{display:flex;align-items:center;gap:.45rem;flex:0 0 auto;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid hsl(var(--fh) 40% 46%);border-radius:.45rem;padding:.32rem .5rem}
.fav span{font-size:.76rem;font-weight:700;white-space:nowrap;max-width:12rem;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fav .fc{font-family:var(--mono);font-size:.6rem;font-weight:800;border:1px solid var(--rule);border-radius:.3rem;padding:.1rem .4rem;color:var(--soft)}
.fav .fc:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.fav .fc.done{background:#1E4D36;color:#8FE3B4;border-color:#1E4D36}
.fav .fx{color:var(--faint);font-size:.9rem;line-height:1}
.favempty{font-size:.74rem;color:var(--faint);padding:.1rem 0 .5rem;font-family:var(--mono)}
@media(max-width:78rem){ body.dopen .favdock{display:none} }
.foot{font-size:.7rem;color:var(--faint);margin:2rem 0 0;line-height:1.7}
.foot a{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--gold);
  color:var(--on-gold);font-weight:800;font-size:.8rem;padding:.45rem .9rem;border-radius:2rem;transition:all .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>

/* ORCHESTRAL LAYERING */
{f:"layer",g:"Build",n:"The warm orchestra in six passes",d:"How to stack stems that belong together.",t:"recipe",k:"recipe",
 b:`Moises makes one stem per run, and every run hears whatever is inside your selection. So build bottom up, and let each pass listen to the last.

<b>0. Set up.</b> Chord track filled in (or run chord detection). Guide mix and vocal audible. Select a <b>range</b> across the tracks, not one event: the extension mixes the selection down and sends that as context.
<b>1. Strings</b> → Contrabass pedal (profile Hold the roots) for the floor, then Low strings foundation for the cellos. Use Project Chords on. Drag each result to its own track.
<b>2. Strings</b> → Warm string bed. Same range. It now hears the low strings.
<b>3. Strings</b> → Violin halo, only if the bed feels small.
<b>4. Keys</b> → Warm analog pad, 10 dB under. This is the glue.
<b>5. Others</b> → Warm French horns, chorus ranges only.
<b>6. Others</b> → Harp or orchestral flute for air. Percussion last: Drums or Others.

Mute what you do not need before each pass. Whatever plays in the range is what the next stem answers.`},
{f:"layer",g:"Build",n:"One section at a time",d:"A caption is a sound, not a timeline.",t:"recipe",k:"recipe",
 b:`Suno let you write arrangement in time: begin with this, answer it with that, build to the finale. <b>The Moises text box cannot do that.</b> It reads a description of a sound, not a sequence.

So the timeline moves out of the words and into the selection:
• Verse range → "soft", "sparse", "intimate" captions.
• Pre chorus range → Cinematic swell.
• Chorus range → full captions, brass, choir.

Same instrument, separate passes, separate captions. Crossfade the joins; the Warm analog pad under everything hides them.`},
{f:"layer",g:"Build",n:"Reference audio beats words",d:"Moises says so on its own panel.",t:"recipe",k:"recipe",
 b:`The panel's own hint: text is more flexible, <b>reference audio tends to be more effective</b>, and the two can be combined.

Build a small reference shelf once:
• 10 to 20 second WAVs of sounds you already love. Strings from an old stem pack, a tabla loop, a sarangi phrase, a bansuri line.
• Solo instrument, no vocal, no other parts.
• Name them by sound: ref_strings_warm.wav, ref_tabla_deep.wav.

Then: reference file for the sound, a Tight caption for the details. This is the single best way to get Indian instruments the model does not know by name.`},
{f:"layer",g:"Build",n:"Chords for Indian songs",d:"When the song lives on a drone.",t:"recipe",k:"recipe",
 b:`Use Project Chords makes a stem follow the chord track (not available for drums). Great for film songs and ballads with real changes.

For raga based, bhajan or drone songs the chord track is thin or misleading:
• Put the tonic as one long chord across the section, or
• Turn Use Project Chords off and raise <b>Context strictness</b> so the stem follows the vocal and drone it hears.

Harmonic strictness only matters when there is harmony to be strict about.`},
{f:"layer",g:"Fix",n:"Replace a stem that went wrong",d:"Separate, mute, regenerate in its place.",t:"recipe",k:"recipe",
 b:`A Suno or reference mix with a thin string part or a tinny tabla:

1. Separate Stems on the mix. Tick only what you will replace, plus Vocals.
2. Mute the bad stem.
3. Select the range. Generate the instrument with a caption from here.
4. Bonus: bounce 15 seconds of the bad stem and use it as reference audio with Context strictness low. It keeps the part's shape and lets the caption fix the tone.`},
{f:"layer",g:"Fix",n:"Creative Control, in one card",d:"What the three sliders and two switches do.",t:"recipe",k:"recipe",
 b:`Behind the sliders button at the bottom left of the panel.

<b>Conditioning strictness</b> → how hard it obeys your words or preset.
<b>Context strictness</b> → how hard it follows the audio in your selection.
<b>Harmonic strictness</b> → how hard it follows the chords and key (not for drums).
Range 0 to 16. Low is adventurous, high is strict. Moises starts named instruments at 2 and Others at 4.

<b>Optimize Conditioning</b> (Custom only) → on is more stable. Off lets the words pull harder, at the cost of stability. Presets always run with it on.
<b>Use Project Chords</b> → follow the chord track.

Profiles on every card here are starting points. Move one slider at a time, by ear. Very high values tend to sound forced; most keepers live between 2 and 8.`},

/* MOISES MOVES */
{f:"moves",g:"Rules",n:"How the text box reads you",d:"Seven rules. Read once.",t:"recipe",k:"recipe",
 b:`<b>1. Describe the sound, not the job.</b> The Custom box matches words to sounds. Moises's own example is four words: "strings with pizzicato".
<b>2. Say it positively.</b> The model hears words, not grammar. "No reverb" puts reverb in the room. Say "close and dry".
<b>3. Short.</b> Moises's help says clear and focused beats overloaded. Most keepers here are 12 to 30 words.
<b>4. Sound first, name last.</b> For instruments it does not know (most Indian ones) the description carries it and the name is a garnish at the end.
<b>5. No artist, song or album names.</b> The models do not know them and Moises's terms do not allow them.
<b>6. No tempo, key or chords in the words.</b> Those come from your selection and the chord track.
<b>7. One part per run, one section per caption.</b> Timelines go in the selection, not the sentence.

And the panel's own hint: reference audio tends to beat text. Use both when it matters.`},
{f:"moves",g:"Generate",n:"Generate vs Regenerate",d:"New track, or rework what is there.",t:"recipe",k:"recipe",
 b:`The first screen asks: What would you like to do?

<b>Generate</b> → a new track from a caption or a reference file. The selection is only the context and the length.
<b>Regenerate</b> → uses the existing audio as context to regenerate a stretch of it, <b>or extend it</b>. The caption there is optional: "Describe the selection you want to regenerate".

Regenerate wants short captions. Switch this page to Regenerate and every card hands you its short fix phrasing.`},
{f:"moves",g:"Generate",n:"Extend a stem",d:"When the generated part stops too soon.",t:"recipe",k:"recipe",
 b:`1. Select a range that starts inside the end of the stem and runs on past it.
2. Regenerate. Leave the caption empty first; the audio is already the brief.
3. If it drifts, repeat with the card's Regenerate phrasing and Context strictness up.`},
{f:"moves",g:"Generate",n:"Presets or Custom",d:"When to use Moises's own presets.",t:"recipe",k:"recipe",
 b:`Each instrument has its own preset list, loaded from your account. Presets always run with Optimize Conditioning on, so they are the stable choice.

The presets are genre shaped (funk, trap, rock overdrive, lo-fi keys and the like), plus <b>AI Match</b>, which lets Moises match your track on its own.

<b>Rule of thumb:</b> western instrument and you are in a hurry, try a preset or AI Match. Anything Indian, anything warm and specific, anything that has to sit with an orchestra: Custom, with a caption from here.`},
{f:"moves",g:"Generate",n:"Credits, in one line",d:"What a generation costs.",t:"recipe",k:"recipe",
 b:`1 credit = 30 seconds of generated audio, rounded up. A 45 second string bed is 2 credits, whatever the result.

So generate the <b>section</b> you need, not the song. Loop and extend what works; regenerate only the bars that went wrong. Separation and voice conversion have their own monthly counts, set by your plan.`},
{f:"moves",g:"Generate",n:"Processing reuses the range",d:"The banner at the bottom, explained.",t:"recipe",k:"recipe",
 b:`"Processing will reuse the previous event/range." After one run, the next one uses the same selection. Handy for the layering passes. <b>Return Home</b> to pick a new range, or you will generate the chorus horns over the verse.`},
{f:"moves",g:"Voice",n:"Voice Conversion",d:"Same performance, another voice model.",t:"recipe",k:"recipe",
 b:`Moises also converts voices. Options on the panel:
• <b>Isolate Vocals</b>: extract the vocal from a mixed source first.
• <b>Pitch Shift</b>: semitones, for a model in a different range.
• Pick a voice model and "Use this model".

Feed it a <b>dry</b> vocal: no reverb, no delay, no bleed. Moises says it works best in English, Spanish, Portuguese and Italian, so treat Hindi and Urdu as test first.

{f:"sep",g:"Pick",n:"What to tick, by source",d:"The separation menu, mapped to real work.",t:"recipe",k:"sep",

<b>Music Stems</b>, grouped the way the panel groups them:

• Strings & Fretted → Bass, Guitars (Acoustic, Electric, Lead, Rhythm), Strings
• Keyboards → Piano, Keys
• Drums & Percussion → Drums, Kick, Snare, Toms, Hi-Hat, Cymbals

<b>On Pro</b> the finer ones open up: Male and Female Vocals, Grand Piano, Percussion, Brass, Reeds, Woodwind, and the drum parts (Hi-Fi only).
<b>Auto detect</b> picks for you and cannot be combined with stems you pick yourself.

Two rules from Moises's help pages:

{f:"sep",g:"Pick",n:"Indian instruments: where they land",d:"No Indian categories, so here is the map.",t:"test",k:"sep",

/* ---------- state ---------- */
const LS = (k,v) => { try{ if(v===undefined){ const x=localStorage.getItem("s10a_mp_"+k); return x?JSON.parse(x):null } localStorage.setItem("s10a_mp_"+k,JSON.stringify(v)) }catch(e){ return null } };
const TH = v => { try{ if(v===undefined) return localStorage.getItem("s10a_pm_theme"); localStorage.setItem("s10a_pm_theme",v) }catch(e){ return null } };
let S = {fam:"orch", grp:"all", sel:null, q:"", mode:LS("mode")||"generate", len:LS("len")||"full",
  favs:LS("favs")||[], mine:LS("mine")||[], ctx:LS("ctx")||{chips:[],free:"",on:false},
  edits:{}, prof:{}, favClosed:!!LS("favClosed"), build:LS("build")||{btn:"strings",base:"",chips:[],flips:[],prof:"auto"}};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all = () => ITEMS.concat(S.mine.map((m,i)=>Object.assign({f:"mine",g:BTN[m.btn]?.label||"Mine",t:"custom",ch:1,id:"mine:"+m.id},m)));
ITEMS.forEach((it,i)=>it.id = it.f+":"+it.n);
const byId = id => all().find(x=>x.id===id);
const famOf = f => FAMS.find(x=>x[0]===f);
const isRecipe = it => it.k==="recipe"||it.k==="sep";

/* ---------- composing the text ---------- */
function ctxWords(){ const c=S.ctx; if(!c.on) return ""; const w=c.chips.map(n=>(CTX.find(x=>x[0]===n)||[])[1]).filter(Boolean); if(c.free.trim()) w.push(c.free.trim()); return w.join(", "); }
function compose(it){
  const ek=it.id+"|"+S.mode; if(S.edits[ek]!==undefined) return S.edits[ek];
  if(S.mode==="regen") return it.r || it.s || it.p;
  let t = S.len==="tight" ? (it.s||it.p) : it.p;
  const c = ctxWords(); if(c) t += ", " + c;
  return t;
}
const NEG = /\b(no|not|never|without|avoid|don'?t|nothing|none|less|minus|except|instead of)\b/i;
function lint(t){
  const out=[]; const w=t.trim()? t.trim().split(/\s+/).length:0;
  if(NEG.test(t)) out.push("A negative word. The model hears the word, not the grammar: \"no reverb\" can bring reverb in. Say the opposite instead.");
  if(/\b\d{2,3}\s*bpm\b|\b[A-G][#b]?\s*(major|minor)\b/i.test(t)) out.push("Tempo or key in the words. Those come from your selection and the chord track; spend the words on sound.");
  if(/\b(then|after that|begin with|gradually|in the chorus|in the verse)\b/i.test(t)) out.push("A sequence. The caption describes one sound. Do the timeline with separate selections.");
  if(w>40) out.push("Long. Past about 40 words the extra detail mostly blurs. Try Tight, or cut the weakest phrase.");
  return {w,out};
}

function setTheme(t){ document.documentElement.setAttribute("data-theme",t); TH(t); }
setTheme(TH()||"dark");

function renderRail(){
  const r=$("rail"); const items=all(); const q=S.q.toLowerCase();
  let h=`<div class="railhead">Make</div><button class="fam build" data-f="build" aria-pressed="${S.fam==="build"}"><span class="dot"></span>Build your own<span class="n">✎</span></button>`;
  h+=`<div class="railhead">Families</div>`;
  FAMS.forEach(([f,name,hue])=>{
    if(f==="sep") h+=`<div class="railhead">Separate</div>`;
    if(f==="mine") h+=`<div class="railhead">Yours</div>`;
    const n=items.filter(x=>x.f===f && vis(x)).length;
    h+=`<button class="fam${q&&!n?" dim":""}" style="--fh:${hue}" data-f="${f}" aria-pressed="${S.fam===f}"><span class="dot"></span>${name}<span class="n">${n}</span></button>`;
  });
  r.innerHTML=h;
  r.querySelectorAll(".fam").forEach(b=>b.onclick=()=>{ S.fam=b.dataset.f; S.grp="all"; S.sel=null; if(S.fam==="sep") setMode("separate",true); else if(S.mode==="separate") setMode("generate",true); render(); });
}
function vis(it){
  if(!S.q) return true;
  const hay=(it.n+" "+it.d+" "+(it.p||"")+" "+(it.b||"")+" "+(it.g||"")+" "+(BTN[it.btn]?.label||"")).toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function renderList(){
  const L=$("list");
  if(S.fam==="build"){ renderBuilder(); return; }
  const fam=famOf(S.fam); document.documentElement.style.setProperty("--fh",fam[2]);
  let items=all().filter(x=>(S.q?true:x.f===S.fam) && vis(x));
  const groups=[...new Set(items.filter(x=>x.f===S.fam).map(x=>x.g))];
  if(!S.q && S.grp!=="all") items=items.filter(x=>x.g===S.grp);
  let h="";
  if(S.q) h+=`<div class="intro">Everything matching <b>${esc(S.q)}</b>, across all families.</div>`;
  else h+=`<div class="intro">${INTRO[S.fam]||""}</div>`;
  if(S.fam==="mine" && !S.q) h+=`<div class="groupbar"><button class="tbtn" id="newMine">＋ new prompt</button><button class="tbtn" id="expMine">⇩ export</button><button class="tbtn" id="impMine">⇧ import</button></div>`;
  if(!S.q && groups.length>1) h+=`<div class="groupbar"><button class="gchip" data-g="all" aria-pressed="${S.grp==="all"}">All</button>`+groups.map(g=>`<button class="gchip" data-g="${esc(g)}" aria-pressed="${S.grp===g}">${esc(g)}</button>`).join("")+`</div>`;
  if(!items.length) h+=`<div class="empty">${S.fam==="mine"?"Nothing saved yet. Edit any prompt and press Save as mine, or build one.":"Nothing matches."}</div>`;
  h+=`<div class="grid">`+items.map(it=>{
    const hue=famOf(it.f)[2]; const fav=S.favs.includes(it.id);
    return `<button class="card" style="--fh:${hue}" data-id="${esc(it.id)}" aria-pressed="${S.sel===it.id}">
      <span class="star${fav?" on":""}" data-star="${esc(it.id)}" title="favourite">${fav?"★":"☆"}</span>
      <h3>${esc(it.n)}</h3><p>${esc(it.d||"")}</p>
      <div class="meta"><span class="tier t-${it.t}">${TIER[it.t][0]}</span>${it.btn?`<span class="btnb">${BTN[it.btn].icon} ${BTN[it.btn].label}</span>`:""}</div></button>`;
  }).join("")+`</div>`;
  h+=FOOT;
  L.innerHTML=h;
  L.querySelectorAll(".gchip").forEach(b=>b.onclick=()=>{S.grp=b.dataset.g;renderList();});
  L.querySelectorAll(".card").forEach(b=>b.onclick=e=>{
    if(e.target.dataset.star){ toggleFav(e.target.dataset.star); return; }
    select(b.dataset.id);
  });
  if($("newMine")) $("newMine").onclick=()=>{ S.fam="build"; render(); };
  if($("expMine")) $("expMine").onclick=exportMine;
  if($("impMine")) $("impMine").onclick=()=>$("importFile").click();
}
function select(id){ S.sel=id; renderList(); renderDetail(); $("detail").classList.add("open"); document.body.classList.add("dopen"); }

function moiPanel(btn, alt, text, prof, ch, editable, idattr){
  const P=PROF[prof||"auto"];
  const tiles=BTNORDER.map(k=>`<${editable==="build"?"button":"div"} class="mt${k===btn?" on":""}${k===alt?" alt":""}" data-btn="${k}"><i>${BTN[k].icon}</i>${BTN[k].label}</${editable==="build"?"button":"div"}>`).join("");
  const L=lint(text);
  const bars = (v)=>`<span class="bar"><i style="width:${(v/16*100).toFixed(0)}%"></i></span>`;
  const drums = btn==="drums";
  return `<div class="moi">
   <div class="moihead"><span class="wave">≋</span> moises <span style="color:var(--faint)">·</span> Generate Stems<small>as it looks in Studio Pro</small></div>
   <div class="moigrid">${tiles}</div>
   <div class="moiseg"><span>Presets</span><span class="on">Custom</span></div>
   <textarea class="moibox" id="${idattr}" spellcheck="false">${esc(text)}</textarea>
   <div class="lint"><span class="wc${L.w>40?" warn":""}" id="${idattr}_wc">${L.w} words</span>${L.out.length?L.out.map(o=>`<span class="lw">${esc(o)}</span>`).join(""):`<span class="lok">✓ reads clean</span>`}</div>
   <div class="profs">${Object.entries(PROF).map(([k,v])=>`<button class="prof" data-prof="${k}" aria-pressed="${k===(prof||"auto")}" title="${esc(v.d)}">${v.n}</button>`).join("")}</div>
   <div class="moiset">
     <div class="setrow">⚙ Creative Control <b class="${P.cc?"on":""}">${P.cc?"on":"off"}</b></div>
     ${P.cc?`<div class="setrow">Conditioning strictness ${bars(P.c)}<b>${P.c.toFixed(1)}</b></div>
     <div class="setrow">Context strictness ${bars(P.x)}<b>${P.x.toFixed(1)}</b></div>
     <div class="setrow">Harmonic strictness ${drums?`<b>n/a on drums</b>`:bars(P.h)+`<b>${P.h.toFixed(1)}</b>`}</div>`:""}
     <div class="setrow">Optimize Conditioning <b class="${P.opt?"on":""}">${P.opt?"on":"off"}</b></div>
     <div class="setrow">Use Project Chords <b class="${!drums&&ch?"on":""}">${drums?"n/a on drums":ch?"on":"off"}</b></div>
     <div class="hint" style="margin-top:.3rem">${esc(P.d)}</div>
   </div>
  </div>`;
}

function renderDetail(){
  const D=$("dbody");
  const it=S.sel && byId(S.sel);
  if(!it){ D.innerHTML=`<div class="empty">Pick a card.<br><br>The panel on the right is drawn like the Moises extension in Studio Pro: the lit tile is the button to press, the text is what to paste.</div>`; return; }
  const fam=famOf(it.f); document.documentElement.style.setProperty("--fh",fam[2]);
  const fav=S.favs.includes(it.id);
  let h=`<div class="dkick">${esc(fam[1])} · ${esc(it.g||"")}</div><h2>${esc(it.n)}</h2><div class="dsub">${esc(it.d||"")}</div>`;
  if(isRecipe(it)){
    h+=`<div class="recipe">${it.b}</div>`;
    h+=`<div class="tip"><span class="tier t-${it.t}">${TIER[it.t][0]}</span> ${esc(TIER[it.t][1])}</div>`;
    h+=`<div class="moifoot"><button class="sbtn${fav?" on":""}" id="dfav">${fav?"★ favourite":"☆ favourite"}</button></div>`;
    D.innerHTML=h; $("dfav").onclick=()=>toggleFav(it.id); return;
  }
  const prof=S.prof[it.id]||it.prof||"auto";
  h+=moiPanel(it.btn,it.alt,compose(it),prof,it.ch,"item","dbox");
  h+=`<div class="moifoot"><button class="cta" id="dcopy">Copy prompt</button>
      <button class="sbtn" id="dreset" title="back to the card's own wording">⟲</button>
      <button class="sbtn${fav?" on":""}" id="dfav">${fav?"★":"☆"}</button>
      <button class="sbtn" id="dbuild" title="open in the builder">✎ build on it</button>
      ${it.f==="mine"?`<button class="sbtn" id="ddel" title="delete this prompt">🗑</button>`:`<button class="sbtn" id="dsave">＋ save as mine</button>`}</div>`;
  h+=`<div style="height:.7rem"></div>`;
  if(it.alt) h+=`<div class="tip"><b>Also try ${BTN[it.alt].label}.</b> The dashed tile. Same words, different model; one of the two usually wins clearly.</div>`;
  if(it.tip) h+=`<div class="tip">${it.tip}</div>`;
  if(it.flip) h+=`<div class="tip flipnote"><b>Defects, said as their opposite.</b> ${esc(it.flip)}</div>`;
  h+=`<div class="tip"><span class="tier t-${it.t}">${TIER[it.t][0]}</span> ${esc(TIER[it.t][1])}</div>`;
  if(S.mode==="regen") h+=`<div class="tip"><b>Regenerate mode.</b> Short fix phrasing. Select only the bars that went wrong on the generated track, then paste.</div>`;
  D.innerHTML=h;
  const box=$("dbox");
  box.oninput=()=>{ S.edits[it.id+"|"+S.mode]=box.value; relint("dbox",box.value); markEdited(); };
  D.querySelectorAll(".prof").forEach(b=>b.onclick=()=>{ S.prof[it.id]=b.dataset.prof; renderDetail(); });
  $("dcopy").onclick=()=>copy(box.value,$("dcopy"));
  $("dreset").onclick=()=>{ delete S.edits[it.id+"|"+S.mode]; delete S.prof[it.id]; renderDetail(); };
  markEdited();
  function markEdited(){ const e=S.edits[it.id+"|"+S.mode]!==undefined; $("dreset").textContent=e?"⟲ edited":"⟲"; $("dreset").classList.toggle("on",e); $("dreset").title=e?"edited by hand: song context and length no longer change it. Click to go back to the card's wording.":"back to the card's own wording"; }
  $("dfav").onclick=()=>toggleFav(it.id);
  $("dbuild").onclick=()=>{ S.build={btn:it.btn,base:box.value,chips:[],flips:[],prof:prof}; LS("build",S.build); S.fam="build"; render(); };
  if($("dsave")) $("dsave").onclick=()=>saveMine(it.n+" (mine)",it.btn,box.value,prof,it.d);
  if($("ddel")) $("ddel").onclick=()=>{ if(!confirm("Delete this prompt?")) return; S.mine=S.mine.filter(m=>"mine:"+m.id!==it.id); LS("mine",S.mine); S.sel=null; render(); };
}
function relint(id,t){
  const L=lint(t); const el=$(id).parentNode.querySelector(".lint");
  el.innerHTML=`<span class="wc${L.w>40?" warn":""}">${L.w} words</span>`+(L.out.length?L.out.map(o=>`<span class="lw">${esc(o)}</span>`).join(""):`<span class="lok">✓ reads clean</span>`);
}

/* ---------- builder ---------- */
function buildText(){
  const b=S.build; const parts=[];
  if(b.base.trim()) parts.push(b.base.trim().replace(/[,.\s]+$/,""));
  b.chips.forEach(c=>parts.push(c));
  b.flips.forEach(f=>{ const x=FLIPS.find(y=>y[0]===f); if(x) parts.push(x[1]); });
  const c=ctxWords(); if(c) parts.push(c);
  return parts.join(", ");
}
function renderBuilder(){
  document.documentElement.style.setProperty("--fh",45);
  const b=S.build; const L=$("list");
  const starters=ITEMS.filter(x=>x.btn===b.btn && !isRecipe(x));
  let h=`<div class="bwrap form"><div class="intro"><b>Build your own.</b> Pick the Moises button, start from a card or from your own words, then add sound words. Every chip adds words; nothing here writes a negative. The result lands in the panel on the right, editable, with the lint watching it.</div>`;
  h+=`<span class="blabel">1 · Moises button</span><div class="moigrid" style="max-width:26rem">${BTNORDER.map(k=>`<button class="mt${k===b.btn?" on":""}" data-bb="${k}"><i>${BTN[k].icon}</i>${BTN[k].label}</button>`).join("")}</div>`;
  h+=`<span class="blabel" style="margin-top:.7rem">2 · Start from</span><select id="bstart"><option value="">my own words</option>${starters.map(x=>`<option value="${esc(x.id)}">${esc(x.n)}</option>`).join("")}</select>`;
  h+=`<span class="blabel">3 · The sound, in your words</span><textarea id="bbase" spellcheck="false" placeholder="e.g. warm string section, sustained chords">${esc(b.base)}</textarea>`;
  h+=`<span class="blabel">4 · Add sound words</span><div class="bcols">`+BUILD.map(([g,cs])=>`<div class="bgroup"><span class="blabel">${g}</span><div class="chips">${cs.map(c=>`<button class="chip" data-bc="${esc(c)}" aria-pressed="${b.chips.includes(c)}">${esc(c)}</button>`).join("")}</div></div>`).join("")+`</div>`;
  h+=`<span class="blabel">5 · Your exclusion habit, flipped</span><div class="hint" style="margin:-.1rem 0 .4rem">Tap the defect you want to avoid. The page writes what to say instead.</div><div class="chips">${FLIPS.map(([a,bb])=>`<button class="chip flip" data-bf="${esc(a)}" aria-pressed="${b.flips.includes(a)}" title="says: ${esc(bb)}">${esc(a)} → ${esc(bb)}</button>`).join("")}</div>`;
  h+=`<div style="margin-top:.8rem"><button class="tbtn danger" id="bclear">⟲ clear the builder</button></div></div>`+FOOT;
  L.innerHTML=h;
  L.querySelectorAll("[data-bb]").forEach(x=>x.onclick=()=>{ b.btn=x.dataset.bb; saveBuild(); renderBuilder(); });
  $("bstart").onchange=e=>{ const it=byId(e.target.value); if(it){ b.base=it.p; b.prof=it.prof||"auto"; } saveBuild(); renderBuilder(); };
  $("bbase").oninput=e=>{ b.base=e.target.value; saveBuild(false); };
  L.querySelectorAll("[data-bc]").forEach(x=>x.onclick=()=>{ const c=x.dataset.bc; b.chips=b.chips.includes(c)?b.chips.filter(y=>y!==c):b.chips.concat(c); x.setAttribute("aria-pressed",b.chips.includes(c)); saveBuild(false); });
  L.querySelectorAll("[data-bf]").forEach(x=>x.onclick=()=>{ const c=x.dataset.bf; b.flips=b.flips.includes(c)?b.flips.filter(y=>y!==c):b.flips.concat(c); x.setAttribute("aria-pressed",b.flips.includes(c)); saveBuild(false); });
  $("bclear").onclick=()=>{ S.build={btn:b.btn,base:"",chips:[],flips:[],prof:"auto"}; saveBuild(); renderBuilder(); };
  renderBuildDetail();
}
function saveBuild(){ LS("build",S.build); renderBuildDetail(); }
function renderBuildDetail(){
  const b=S.build; const D=$("dbody"); const t=buildText();
  D.innerHTML=`<div class="dkick" style="--fh:45">Build your own</div><h2>Your prompt</h2><div class="dsub">Edit freely before you copy. Changing a chip rebuilds the text.</div>`+
   moiPanel(b.btn,null,t,b.prof,b.btn!=="drums","build","bbox")+
   `<div class="moifoot"><button class="cta" id="bcopy">Copy prompt</button><button class="sbtn" id="bsave">＋ save as mine</button></div>`;
  const box=$("bbox"); box.oninput=()=>relint("bbox",box.value);
  D.querySelectorAll(".prof").forEach(x=>x.onclick=()=>{ b.prof=x.dataset.prof; saveBuild(); });
  D.querySelectorAll(".moi .mt").forEach(x=>x.onclick=()=>{ b.btn=x.dataset.btn; saveBuild(); renderBuilder(); });
  $("bcopy").onclick=()=>copy(box.value,$("bcopy"));
  $("bsave").onclick=()=>{ const n=prompt("Name this prompt"); if(n) saveMine(n,b.btn,box.value,b.prof,"Built by you."); };
}

/* ---------- mine, favs, copy ---------- */
function saveMine(n,btn,p,prof,d){
  const m={id:Date.now().toString(36),n:n||"Untitled",btn,p,s:p,r:"",prof,d:d||""};
  S.mine.push(m); LS("mine",S.mine); toast("saved to My Prompts"); renderRail();
}
function exportMine(){
  const blob=new Blob([JSON.stringify({moisesPromptMachine:1,prompts:S.mine,favs:S.favs},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="my-moises-prompts.json"; a.click();
}
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const ps=(j.prompts||[]).filter(p=>p&&p.p&&BTN[p.btn]);
    const have=new Set(S.mine.map(m=>m.id)); ps.forEach(p=>{ if(!have.has(p.id)) S.mine.push({id:String(p.id||Date.now().toString(36)),n:String(p.n||"Imported"),btn:p.btn,p:String(p.p),s:String(p.s||p.p),r:String(p.r||""),prof:PROF[p.prof]?p.prof:"auto",d:String(p.d||"")}); });
    LS("mine",S.mine); toast(ps.length+" prompts imported"); render(); }catch(err){ alert("That file is not a prompt export."); } };
  r.readAsText(f); e.target.value="";
};
function toggleFav(id){ S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):S.favs.concat(id); LS("favs",S.favs); renderList(); renderFavs(); if(S.sel===id) renderDetail(); }
function renderFavs(){
  const w=$("favwrap"); const favs=S.favs.map(byId).filter(Boolean);
  $("favdock").classList.toggle("closed",S.favClosed); $("favtoggle").textContent=S.favClosed?"show":"hide";
  $("favhint").textContent=favs.length?"copies follow the mode and length above":"star anything to pin it here";
  w.innerHTML=favs.length?favs.map(it=>`<div class="fav" style="--fh:${famOf(it.f)[2]}"><span data-open="${esc(it.id)}">${esc(it.n)}</span>${isRecipe(it)?"":`<button class="fc" data-copy="${esc(it.id)}">copy</button>`}<button class="fx" data-unfav="${esc(it.id)}" title="unpin">×</button></div>`).join(""):`<div class="favempty">nothing pinned yet</div>`;
  w.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const it=byId(b.dataset.open); S.fam=it.f; S.grp="all"; render(); select(it.id); });
  w.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(compose(byId(b.dataset.copy)),b));
  w.querySelectorAll("[data-unfav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.unfav));
}
function copy(t,btn){
  const done=()=>{ const o=btn.textContent; btn.classList.add("done"); btn.textContent="copied ✓"; setTimeout(()=>{btn.classList.remove("done");btn.textContent=o},1400); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fallback(t,done)); else fallback(t,done);
}
function fallback(t,done){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); done(); }
function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); setTimeout(()=>x.classList.remove("show"),1500); }

/* ---------- modes, context ---------- */
const MNOTE={generate:"Generate: a new track from words, a reference file or both. One stem per run.",
  regen:"Regenerate: rework or extend a stretch of existing audio. Captions turn into short fixes.",
  separate:"Separate: split a mix into stems. The recipes here say what to tick."};
function setMode(m,quiet){ S.mode=m; LS("mode",m);
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m)); $("mnote").textContent=MNOTE[m];
  if(!quiet){ if(m==="separate"){ S.fam="sep"; S.sel=null; } else if(S.fam==="sep"){ S.fam="orch"; S.sel=null; } render(); } }
function setLen(l){ S.len=l; LS("len",l); document.querySelectorAll("#lenseg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l)); renderDetail(); if(S.fam==="build") renderBuildDetail(); }
function renderCtx(){
  const c=S.ctx;
  $("ctxchips").innerHTML=CTX.map(([n,w])=>`<button class="chip" data-cx="${esc(n)}" aria-pressed="${c.chips.includes(n)}" title="adds: ${esc(w)}">${esc(n)}</button>`).join("");
  $("ctxfree").value=c.free; $("ctxon").checked=c.on;
  const w=ctxWords(); const st=$("ctxstate");
  st.textContent = c.on&&w ? "on · adds: "+w : (c.chips.length||c.free ? "set, but off" : "off · mood words you want on every prompt");
  st.classList.toggle("on",!!(c.on&&w));
  $("ctxchips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const n=b.dataset.cx; c.chips=c.chips.includes(n)?c.chips.filter(x=>x!==n):c.chips.concat(n); if(c.chips.length) c.on=true; saveCtx(); });
}
function saveCtx(){ LS("ctx",S.ctx); renderCtx(); if(S.fam==="build") renderBuildDetail(); else renderDetail(); }
$("ctxfree").oninput=e=>{ S.ctx.free=e.target.value; if(S.ctx.free.trim()) S.ctx.on=true; LS("ctx",S.ctx); const w=ctxWords(); $("ctxstate").textContent=S.ctx.on&&w?"on · adds: "+w:"off"; $("ctxstate").classList.toggle("on",!!(S.ctx.on&&w)); if(S.fam==="build") renderBuildDetail(); else renderDetail(); };
$("ctxon").onchange=e=>{ S.ctx.on=e.target.checked; saveCtx(); };
$("ctxclear").onclick=()=>{ S.ctx={chips:[],free:"",on:false}; saveCtx(); };

const INTRO={
 orch:"<b>Strings is where the warm orchestra starts.</b> Every caption here is positive, short and about the sound. Moises reads the text box as a description of audio, not as instructions, so the defects you used to exclude in Suno are said here as their opposite.",
 pads:"<b>Warm pads and keys.</b> The glue layer. Generate after the strings, keep it well under them, and the joins between generated stems disappear.",
 brass:"<b>Brass, winds and choir all live under Others.</b> Moises has six buttons and no brass one, so Others is where the rest of the orchestra is.",
 indbow:"<b>Indian strings.</b> Moises does not know most of these by name. The captions lead with the sound in plain words and put the name last. Reference audio helps most here.",
 indwind:"<b>Indian winds.</b> All under Others. Breath and slides first, the name last.",
 pluck:"<b>Guitars, and the plucked instruments that are not guitars.</b> The Guitars button pulls everything toward a guitar, so sitar and friends sit in Indian Strings under Others.",
 bass:"<b>Bass, including the orchestral low end.</b> For long bowed notes below the cellos, start with <b>Orchestral low</b>: those go through the Strings button, because the Bass button answers like a bass player. Short captions work best here. The notes come from the chords and the context; the words only choose the tone.",
 perc:"<b>Drums and Indian percussion.</b> The Drums model thinks in kits. Tabla, dholak and the rest start under Others. No harmonic settings on drums.",
 layer:"<b>How to make generated stems sound like one orchestra</b>, not six guesses stacked on top of each other.",
 moves:"<b>What the Moises panel can do beyond one prompt.</b> Regenerate, extend, presets, voices, the library.",
 sep:"<b>Separating stems.</b> What to tick for the job, and where Indian instruments end up when there is no button for them.",
 mine:"<b>Your own prompts.</b> Saved in this browser. Export them to move to another machine or share with a collaborator."
};
const FOOT=`<div class="foot">Studio 10A · <a href="https://studio10a.com/">studio10a.com</a>. Sounds better.<br>Built from the Moises extension inside Fender Studio Pro and Moises's own help pages. Moises is a trademark of its owner; this page is independent and not affiliated.<br>Also from the room: <a href="studio1.html">Suno Prompt Builder</a> · <a href="studio2.html">Suno Studio 2 Prompt Machine</a></div>`;

/* ---------- wiring ---------- */
function render(){ renderRail(); renderList(); if(S.fam!=="build") renderDetail(); renderFavs(); }
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll("#lenseg button").forEach(b=>b.onclick=()=>setLen(b.dataset.l));
$("q").oninput=e=>{ S.q=e.target.value.trim(); renderRail(); renderList(); };
$("clearBtn").onclick=$("home").onclick=()=>{ S.q=""; $("q").value=""; S.fam="orch"; S.grp="all"; S.sel=null; closeD(); setMode("generate"); };
$("resetBtn").onclick=()=>{ if(!confirm("Wipe favourites, your saved prompts, the builder, song context and preferences in this browser?")) return;
  try{ Object.keys(localStorage).filter(k=>k.startsWith("s10a_mp_")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload(); };
$("themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");
$("favtoggle").onclick=()=>{ S.favClosed=!S.favClosed; LS("favClosed",S.favClosed); renderFavs(); };
