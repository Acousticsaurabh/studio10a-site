<title>Suno Studio 2 · Prompt Machine · Studio 10A</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Mulish:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --gold:#FCBA00; --blue:#41608F; --ink:#0B0D11; --page:#14181E; --card:#1A1F27; --sunk:#0F1319;
  --text:#ECEFE9; --soft:#98A29B; --faint:#6B746E; --rule:#2A313A; --on-gold:#0B0D11;
  --body:Mulish,"Avenir Next",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; --h:38;
}
:root[data-theme="light"]{
  --ink:#E6E8E2; --page:#FBFBF9; --card:#FFFFFF; --sunk:#F0F0EA;
  --text:#14181E; --soft:#5A6360; --faint:#8A928D; --rule:#D6D9D2;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none} input{font:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh}

header{display:flex;align-items:center;gap:.85rem;padding:.55rem clamp(.7rem,2vw,1.3rem);
  background:linear-gradient(180deg,var(--page),var(--ink));border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{flex:0 0 auto;display:block;line-height:0}
.wm{height:46px;width:auto;display:block}
.wm.light{display:none}
:root[data-theme="light"] .wm.dark{display:none}
:root[data-theme="light"] .wm.light{display:block}
.brand{cursor:pointer}
.brand:hover{opacity:.85}
.ttl{text-align:left;cursor:pointer;font-family:var(--body);font-weight:800;font-size:clamp(.92rem,2.2vw,1.2rem);letter-spacing:-.015em;
  padding-left:.85rem;border-left:1px solid var(--rule);min-width:0}
.ttl em{font-style:normal;font-weight:900;color:var(--gold)}
.ttl:hover em{text-decoration:underline;text-underline-offset:3px}
.ttl s{display:block;text-decoration:none;font-family:var(--mono);font-size:.52rem;letter-spacing:.15em;
  color:var(--faint);text-transform:uppercase;margin-top:.1rem}
.tools{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.srch{position:relative}
.srch input{background:var(--sunk);border:1px solid var(--rule);border-radius:2rem;color:var(--text);
  padding:.44rem .9rem .44rem 2rem;width:min(15rem,42vw);font-size:.82rem;outline:none}
.srch input:focus{border-color:var(--gold)}
.srch::before{content:"⌕";position:absolute;left:.72rem;top:50%;transform:translateY(-52%);color:var(--faint)}
.tbtn{border:1px solid var(--rule);border-radius:2rem;padding:.4rem .8rem;font-size:.75rem;font-weight:700;
  background:var(--sunk);white-space:nowrap}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}

/* mode bar */
.modebar{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
  padding:.5rem clamp(.7rem,2vw,1.3rem);background:var(--sunk);border-bottom:1px solid var(--rule)}
.mlabel{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.mode{border:1px solid var(--rule);background:var(--card);border-radius:.5rem;padding:.42rem .95rem;
  font-size:.82rem;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:.45rem}
.mode i{font-style:normal;font-size:.95rem;line-height:1}
.mode:hover{color:var(--text);border-color:var(--gold)}
.mode[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.mode.alt[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.mnote{font-size:.72rem;color:var(--faint);margin-left:auto;max-width:34rem;text-align:right}
@media(max-width:52rem){ .mnote{display:none} }

.main{display:grid;grid-template-columns:13.5rem minmax(0,1fr);min-height:0}
@media(max-width:60rem){ .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)} }
.rail{background:var(--page);border-right:1px solid var(--rule);overflow:auto;padding:.6rem .5rem 2rem}
@media(max-width:60rem){ .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;gap:.4rem;
  overflow-x:auto;padding:.55rem .6rem;scrollbar-width:none} .rail::-webkit-scrollbar{display:none} .railhead{display:none} }
.railhead{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);padding:.5rem .6rem .35rem}
.fam{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.5rem .6rem;
  border-radius:.5rem;font-size:.85rem;font-weight:700;color:var(--soft);white-space:nowrap;border:1px solid transparent}
.fam .dot{width:.62rem;height:.62rem;border-radius:50%;background:hsl(var(--fh) 40% 46%);flex:0 0 auto;
  box-shadow:0 0 0 3px hsl(var(--fh) 40% 46% / .16)}
.fam .n{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.fam:hover{background:var(--sunk);color:var(--text)}
.fam[aria-pressed="true"]{background:hsl(var(--fh) 40% 44% / .14);color:var(--text);border-color:hsl(var(--fh) 40% 46% / .45)}
.fam.dim{opacity:.35}
@media(max-width:60rem){ .fam{width:auto;flex:0 0 auto;background:var(--sunk)} .fam .n{display:none} }

.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,27rem);min-height:0}
@media(max-width:76rem){ .content{grid-template-columns:minmax(0,1fr)} }
.list{overflow:auto;padding:.9rem clamp(.7rem,2vw,1.2rem) 9rem;min-width:0}
.groupbar{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .9rem}
.gchip{border:1px solid var(--rule);border-radius:2rem;padding:.28rem .72rem;font-size:.74rem;font-weight:700;
  color:var(--soft);background:var(--sunk)}
.gchip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr))}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-left:4px solid hsl(var(--fh) 40% 46%);border-radius:.6rem;padding:.7rem .8rem .75rem;
  transition:transform .12s ease,border-color .12s ease}
.card:hover{transform:translateY(-2px);border-color:hsl(var(--fh) 40% 46%)}
.card[aria-pressed="true"]{outline:2px solid hsl(var(--fh) 40% 46%);outline-offset:1px}
.card h3{margin:0;font-size:.94rem;font-weight:800;letter-spacing:-.01em;padding-right:1.2rem}
.card p{margin:.25rem 0 0;font-size:.76rem;color:var(--soft);line-height:1.4}
.tier{display:inline-block;margin-top:.5rem;font-family:var(--mono);font-size:.53rem;letter-spacing:.13em;
  text-transform:uppercase;padding:.16rem .45rem;border-radius:.3rem;font-weight:600}
.t-proven{background:#1E4D36;color:#8FE3B4} .t-solid{background:#1E3A55;color:#8FC6EF}
.t-describe{background:#4A3714;color:#F0C878}
:root[data-theme="light"] .t-proven{background:#DCF2E6;color:#1B5B3C}
:root[data-theme="light"] .t-solid{background:#DEEBF7;color:#1D4B72}
:root[data-theme="light"] .t-describe{background:#F8ECD2;color:#7A5410}
.star{position:absolute;top:.45rem;right:.5rem;font-size:.95rem;line-height:1;color:var(--faint);padding:.1rem .2rem;border-radius:.3rem}
.star:hover,.star.on{color:var(--gold)}

.detail{background:var(--page);border-left:1px solid var(--rule);overflow:auto;padding:1rem 1rem 9rem}
@media(max-width:76rem){ .detail{position:fixed;inset:auto 0 0 0;height:82dvh;border-left:0;
  border-top:2px solid hsl(var(--fh) 40% 46%);border-radius:1rem 1rem 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5);
  transform:translateY(101%);transition:transform .22s ease;z-index:40} .detail.open{transform:none} }
.dclose{display:none}
@media(max-width:76rem){ .dclose{display:block;position:sticky;top:0;margin-left:auto;font-size:1.4rem;
  line-height:1;color:var(--faint);padding:0 .2rem} }
.empty{color:var(--faint);font-size:.84rem;text-align:center;padding:3rem 1rem;font-family:var(--mono)}
.welcome{padding:1.4rem .3rem 1rem;max-width:24rem}.welcome p{margin:0 0 .9rem}.welcome .w1{font-size:.95rem;font-weight:700;line-height:1.45;color:var(--text)}.welcome .w2{font-size:.85rem;color:var(--soft)}.welcome .w3{font-size:.85rem;color:var(--soft)}.welcome .w4{font-size:.76rem;color:var(--faint);border-top:1px solid var(--rule);padding-top:.85rem;margin-top:1.2rem}
.dkick{font-family:var(--mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:hsl(var(--fh) 40% 48%)}
.detail h2{font-family:var(--body);font-weight:800;font-size:1.32rem;margin:.25rem 0 .1rem;line-height:1.15;letter-spacing:-.015em}
.dsub{font-size:.8rem;color:var(--soft);margin:.3rem 0 .9rem}
.block{background:var(--sunk);border:1px solid var(--rule);border-radius:.55rem;margin:0 0 .7rem}
.block.hero{border-color:hsl(var(--fh) 40% 46% / .55)}
.bhead{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;border-bottom:1px solid var(--rule)}
.blabel{font-family:var(--mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.copy{margin-left:auto;border:1px solid var(--rule);border-radius:.35rem;padding:.22rem .7rem;
  font-size:.68rem;font-weight:800;font-family:var(--mono);letter-spacing:.06em}
.copy.big{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.copy:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.copy.done{background:#1E4D36;color:#8FE3B4;border-color:#1E4D36}
.block pre{margin:0;padding:.6rem;font-family:var(--mono);font-size:.72rem;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;color:var(--text)}
.tip{font-size:.76rem;color:var(--soft);background:hsl(var(--fh) 38% 44% / .1);
  border:1px solid hsl(var(--fh) 38% 44% / .3);border-radius:.5rem;padding:.55rem .7rem;margin:0 0 .7rem}
.tip b{color:var(--text)}
.legend{font-size:.7rem;color:var(--faint);margin:1.4rem 0 0;line-height:1.6}
.legend code{font-family:var(--mono);font-size:.66rem}
.count{font-family:var(--mono);font-size:.6rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .7rem}

.favdock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,var(--page),var(--sunk));
  border-top:2px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.favhead{display:flex;align-items:center;gap:.6rem;padding:.4rem clamp(.7rem,2vw,1.2rem)}
.favhead b{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.favhead .hint{font-size:.7rem;color:var(--faint)}
.favtoggle{margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--soft);
  border:1px solid var(--rule);border-radius:.35rem;padding:.16rem .55rem}
.favwrap{display:flex;gap:.45rem;overflow-x:auto;padding:0 clamp(.7rem,2vw,1.2rem) .55rem}
.favdock.closed .favwrap{display:none}
.fav{display:flex;align-items:center;gap:.45rem;flex:0 0 auto;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid hsl(var(--fh) 40% 46%);border-radius:.45rem;padding:.32rem .5rem}
.fav span{font-size:.76rem;font-weight:700;white-space:nowrap;max-width:12rem;overflow:hidden;text-overflow:ellipsis}
.fav .fc{font-family:var(--mono);font-size:.6rem;font-weight:800;border:1px solid var(--rule);border-radius:.3rem;
  padding:.1rem .4rem;color:var(--soft)}
.fav .fc:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.fav .fc.done{background:#1E4D36;color:#8FE3B4;border-color:#1E4D36}
.fav .fx{color:var(--faint);font-size:.9rem;line-height:1}
.favempty{font-size:.74rem;color:var(--faint);padding:.1rem 0 .5rem;font-family:var(--mono)}
@media(max-width:76rem){ body.dopen .favdock{display:none} }
</style>

, intimate.", "t": "solid", "k": "inst", "b": "a string quartet playing close and intimate, two violins, viola and cello, recorded near enough that the rosin and bow noise are audible, small warm room, narrow stereo, restrained conversational playing with human timing, gentle portamento between notes and small dynamic movements.", "neg": "It must not sound orchestral, epic or reverberant. Four people in a room, not a section.", "x": "-orchestral -epic -cinematic -wall of sound -heavy reverb -big hall", "tip": "When a ballad needs strings but a section would drown it."}, {"f": "bow", "g": "Solo", "n": "Solo violin lead", "d": "A singing solo line.", "t": "solid", "k": "inst", "b": "a solo violin playing a singing lead line, warm and vocal in the middle register, long expressive bows with human vibrato that arrives after the note rather than on it, sliding gently between phrases the way a singer breathes, rosin and bow texture audible, recorded close in a small warm room.", "neg": "It must never be virtuosic, fast or staccato, and it must not sound orchestral or drenched in reverb.", "x": "-fast runs -virtuosic -staccato -aggressive -orchestral -heavy reverb -thin -harsh", "tip": ""}, {"f": "bow", "g": "Solo", "n": "Solo cello", "d": "Low, human, mournful.", "t": "solid", "k": "inst", "b": "a solo cello in its low and middle register, deep woody resonant tone with the body of the instrument audible, long slow bows heavy on the string, human vibrato and audible breath in the phrasing, closer to a human voice than to an orchestra, recorded close and dry with a little natural room.", "neg": "It must stay low, never climb into the high register, and never sound orchestral or bright.", "x": "-high register -fast runs -staccato -orchestral -bright -thin", "tip": ""}, {"f": "bow", "g": "Texture", "n": "Pizzicato strings", "d": "Plucked, rhythmic, light.", "t": "solid", "k": "inst", "b": "pizzicato strings plucked short and dry, light and rhythmic, low strings marking the pulse with upper strings answering in small figures, woody and percussive with the string snap audible, close recorded with almost no reverb.", "neg": "Nothing bowed, nothing sustained, no reverb tail.", "x": "-bowed -sustained -legato -heavy reverb -orchestral swell", "tip": "Movement under a verse without bringing drums in."}, {"f": "bow", "g": "Texture", "n": "Tremolo tension bed", "d": "Unease under a scene.", "t": "solid", "k": "inst", "b": "sustained tremolo strings holding a single dark chord, bows shivering fast and close to the bridge in the low and mid register, slowly growing in intensity and never resolving, cinematic and dry rather than reverberant.", "neg": "No melody, no resolution, no percussion, nothing bright or major.", "x": "-melody -resolution -bright -major key -percussion -brass", "tip": "Stage underscore. Under dialogue, not under a song."}, {"f": "bow", "g": "Indian", "n": "Sarangi", "d": "The crying bowed voice.", "t": "describe", "k": "inst", "b": "a bowed Indian string instrument with a deeply vocal crying tone, gut strings and sympathetic strings ringing behind every note, played with heavy continuous portamento so the pitch slides between notes exactly the way a singer slides and never steps cleanly from one note to the next, nasal, reedy, grainy and human in the mid register, ornamented with fast grace notes around the main note, recorded close in a small dry room with the bow and the sympathetic strings audible. This instrument is a sarangi.", "neg": "It must not come out as a violin or any western string instrument, and the intonation must slide rather than sit clean.", "x": "-violin -western strings -clean intonation -vibrato -orchestral -bright", "tip": "The description carries this one, not the word. If it returns a violin, push the sliding and the sympathetic strings harder rather than repeating the name."}, {"f": "bow", "g": "Indian", "n": "Dilruba / Esraj", "d": "Softer, breathier bowed Indian.", "t": "describe", "k": "inst", "b": "a soft fretted bowed Indian string instrument with a gentle breathy tone and long sympathetic string resonance, quieter and rounder than a sarangi, sliding smoothly between notes with slow meend rather than fast ornament, meditative and unhurried in the mid to low register, played with a light bow, close recorded, warm and dry with the sympathetic strings shimmering under the main note. This instrument is a dilruba.", "neg": "It must not be loud, aggressive or fast, and it must not come out as a violin.", "x": "-loud -aggressive -violin -western strings -fast runs -bright", "tip": ""}, {"f": "pluck", "g": "Indian", "n": "Sitar", "d": "The one Suno genuinely knows.", "t": "solid", "k": "inst", "b": "a solo sitar with a bright metallic plucked tone, the buzzing jawari edge on every note and sympathetic strings ringing underneath, bending notes upward with wide meend pulls across several notes on one stroke and ornaments falling around the main note, warm low resonance from the gourd with the plectrum attack audible, unhurried and exploratory in the low and middle register, recorded close with natural room.", "neg": "It must not turn into a guitar, must not shred, and must stay on Indian scales rather than western ones.", "x": "-guitar -western scales -fast shredding -EDM -distorted -thin -tinny", "tip": ""}, {"f": "pluck", "g": "Indian", "n": "Sarod", "d": "Fretless, dark, glissando.", "t": "describe", "k": "inst", "b": "a fretless plucked Indian string instrument with a dark metallic sustain and a smooth polished fingerboard, so every note slides continuously into the next with no fret steps at all, plucked hard with a wooden pick so the attack is sharp and the decay is long and singing, deeper and heavier than a sitar with less buzz and more weight, brooding in the low and middle register, recorded close and dry. This instrument is a sarod.", "neg": "It must not come out as a sitar or a guitar, and there must be no fret steps in the slides.", "x": "-sitar -guitar -bright -tinny -buzzy -fast shredding", "tip": "Say fretless and sliding first. That is what separates it from sitar."}, {"f": "pluck", "g": "Indian", "n": "Santoor", "d": "Hammered, glassy, raining.", "t": "describe", "k": "inst", "b": "a hammered Indian dulcimer struck with light wooden mallets, many thin metal strings per note giving a glassy shimmering chorus on every strike, notes falling in fast rippling cascades that ring into each other like rain on water, bright but sweet with long natural decay and no damping, recorded close in a warm room. This instrument is a santoor.", "neg": "It must not sound like a piano or a harp, and it must never be harsh or clanging.", "x": "-piano -harp -plucked -tinny -harsh -metallic clang", "tip": ""}, {"f": "pluck", "g": "Indian", "n": "Veena", "d": "Deep, sacred, resonant.", "t": "describe", "k": "inst", "b": "a large fretted Indian plucked string instrument with a deep round resonant body tone, thick strings plucked slowly and allowed to ring out fully, heavy pulls that bend a single note across a wide interval, long sustain with a low drone string sounding underneath, ancient and unhurried, lower and rounder than a sitar with far less buzz, close recorded with minimal reverb. This instrument is a veena.", "neg": "It must be slower than a sitar with real space between the notes, and it must not buzz brightly.", "x": "-sitar -bright -buzzy -fast -guitar", "tip": ""}, {"f": "pluck", "g": "Guitar", "n": "Fingerpicked steel acoustic", "d": "Warm, human, close.", "t": "proven", "k": "inst", "b": "a solo steel string acoustic guitar fingerpicked with the flesh of the thumb and fingers rather than a pick, warm and woody in the low register with string noise and fret squeak audible, gentle and unhurried with human timing, recorded very close with almost no reverb.", "neg": "Nothing strummed, nothing quantized, no pick attack and no reverb wash.", "x": "-strummed -aggressive -distorted -electric -heavy reverb -quantized -bright pick attack", "tip": "The default acoustic."}, {"f": "pluck", "g": "Guitar", "n": "Nylon string guitar", "d": "Soft, round, classical.", "t": "solid", "k": "inst", "b": "a solo nylon string classical guitar with a soft round mellow tone and no metallic edge, fingerpicked cleanly in the middle register, gentle and warm with natural decay and a small amount of room, restrained and lyrical, played the way an accompanist plays behind a singer.", "neg": "No steel string brightness, no strumming, no flamenco flourishes, no fast runs.", "x": "-steel string -bright -harsh -strummed -flamenco -fast runs", "tip": ""}, {"f": "pluck", "g": "Orchestral", "n": "Concert harp", "d": "Falling, liquid, cinematic.", "t": "solid", "k": "inst", "b": "a solo concert harp with glissandi falling and rising in liquid cascades, individual notes plucked warm and round with long natural decay and strings ringing into each other, gentle and weightless with a wide natural hall around it.", "neg": "It must not sound like a santoor or a piano, and it must never be percussive.", "x": "-santoor -piano -aggressive -percussive -bright -tinny", "tip": "Harp glides. Santoor rains. Different instruments."}, {"f": "wind", "g": "Indian", "n": "Bansuri", "d": "Breath first, note second.", "t": "describe", "k": "inst", "b": "a solo bamboo transverse flute with a soft breathy woody tone, audible breath at the start and end of every phrase, notes sliding into each other with continuous meend rather than stepping cleanly, warm and hollow in the low register with no metallic edge whatsoever, long unhurried phrases with silence between them and light ornament around the main note, recorded close in a warm dry room so the breath is part of the sound. This instrument is a bansuri.", "neg": "It must not come out as a silver concert flute or a piccolo, and it must never sound metallic or bright.", "x": "-concert flute -silver flute -metallic -bright -piccolo -fast runs -vibrato", "tip": "Lead with breathy and bamboo or you will get a silver flute."}, {"f": "wind", "g": "Indian", "n": "Shehnai", "d": "The wedding double reed.", "t": "describe", "k": "inst", "b": "a solo Indian double reed wind instrument with a bright nasal buzzing tone, piercing and reedy and unmistakably ceremonial, held notes that waver and slide between pitches with continuous ornament, played over a soft continuous drone, festive and auspicious rather than mournful, recorded in a real space with natural air around it. This instrument is a shehnai.", "neg": "It must not come out as an oboe or a clarinet, and it must not be smooth or mellow.", "x": "-oboe -clarinet -western -smooth -mellow -orchestral", "tip": "Nasal and reedy are the two words doing the work."}, {"f": "wind", "g": "Orchestral", "n": "Concert flute", "d": "Silver, clean, agile.", "t": "solid", "k": "inst", "b": "a solo silver concert flute playing a clean lyrical line in the middle register, pure and clear with light breath tone, even articulation and gentle vibrato at the end of long notes, recorded in a warm room with natural space.", "neg": "This is deliberately not a bansuri. No bamboo tone, no heavy breath, nothing shrill.", "x": "-bansuri -bamboo -breathy -piccolo -shrill -harsh", "tip": ""}, {"f": "wind", "g": "Orchestral", "n": "Clarinet", "d": "Woody, warm, low.", "t": "solid", "k": "inst", "b": "a solo clarinet in its warm woody low register, round and hollow with no reediness at the top, smooth legato phrasing, gentle and conversational, recorded close with a small amount of room.", "neg": "Nothing shrill, nothing squeaky, no high register and no jazz runs.", "x": "-shrill -high register -squeaky -jazz runs -harsh", "tip": ""}, {"f": "wind", "g": "Orchestral", "n": "Tenor saxophone", "d": "Late night, breathy.", "t": "solid", "k": "inst", "b": "a solo tenor saxophone playing slow and breathy in its low register, warm and husky with audible air in the tone, phrases ending softly, late night and intimate, recorded close in a small room with a short tail.", "neg": "No honking, no fast bebop lines, no smooth-jazz gloss.", "x": "-honking -fast bebop -bright -aggressive -smooth jazz gloss", "tip": ""}, {"f": "wind", "g": "Section", "n": "Brass section stabs", "d": "Short, bright, punctuation.", "t": "solid", "k": "inst", "b": "a tight brass section playing short punchy stabs, trumpets and trombones in unison, bright and forward with hard attacks and immediate cutoffs, leaving silence between hits, recorded close and dry with minimal tail.", "neg": "Punctuation only. Nothing sustained, nothing legato, no orchestral swell.", "x": "-sustained -legato -orchestral swell -soft -mellow", "tip": "Two or three hits, not a line."}, {"f": "perc", "g": "Desi", "n": "Tabla, deep bayan", "d": "The anti-thin tabla clause.", "t": "proven", "k": "inst", "b": "solo tabla, deep and low tuned, with a heavy resonant bayan carrying real weight in the low register, warm and round rather than thin or high pitched, the dayan singing clean open strokes with pitch while the bayan slides underneath with palm pressure so the low note bends, human timing with breath in it, recorded close and dry in a small warm room.", "neg": "It must never be thin, tinny or high pitched, and it must never be machine locked or electronic.", "x": "-thin tabla -high-pitched tabla -tinny percussion -thin drums -weak percussion -weak bass -quantized -electronic", "tip": "The standing anti-thin clause. Do not drop the low tuned wording, that is the part that works."}, {"f": "perc", "g": "Desi", "n": "Dholak", "d": "Folk two-headed, hands.", "t": "proven", "k": "inst", "b": "solo dholak played with bare hands, a warm woody two headed folk drum with a deep bassy left head and a bright sharp right head answering it, rolling folk pattern with human swing and small timing imperfections, rustic and celebratory, recorded close in a real room with the wood of the shell audible.", "neg": "It must not be a tabla, must not be electronic, and must not sound machine timed.", "x": "-tabla -electronic -quantized -thin -tinny -weak bass -machine timing", "tip": "The folk workhorse, where tabla would be too formal."}, {"f": "perc", "g": "Desi", "n": "Dhol", "d": "Loud, outdoor, stick.", "t": "proven", "k": "inst", "b": "solo dhol, a large barrel drum played with two sticks, a huge deep bass boom on one side and a hard cracking treble on the other, a powerful outdoor celebratory pattern with heavy accents played hard, with a big natural room around it, the sound of a street rather than a booth.", "neg": "It must never be thin or polite, and it must not be electronic or quantized.", "x": "-thin -tinny -weak bass -electronic -quantized -indoor -polite", "tip": ""}, {"f": "perc", "g": "Desi", "n": "Pakhawaj", "d": "Deep, ancient, temple.", "t": "proven", "k": "inst", "b": "solo pakhawaj, a large ancient two headed barrel drum played with flat hands, very deep resonant low strokes with long decay and a dry woody higher head, a slow ceremonial pattern with enormous space between strokes, grave and devotional rather than energetic, recorded in a stone room with natural tail.", "neg": "It must not be fast or busy, must not be a tabla, and must never sound martial or like war drums.", "x": "-tabla -fast -busy -electronic -thin -tinny -martial -war drums", "tip": "The temple alternative to tabla. Slower, heavier, older."}, {"f": "perc", "g": "Desi", "n": "Mridangam", "d": "South Indian, tuned, crisp.", "t": "describe", "k": "inst", "b": "a solo double headed South Indian barrel drum played with both hands, crisp tuned strokes with a bright ringing right head and a deep dry left head loaded to give a low thud, intricate fast finger patterns with clean articulation and no reverb, recorded very close and dry. This instrument is a mridangam.", "neg": "It must not drift into tabla, and there must be no reverb on it at all.", "x": "-tabla -reverb -electronic -quantized -thin -tinny", "tip": ""}, {"f": "perc", "g": "Desi", "n": "Manjira and kartal", "d": "Small metal, the pulse.", "t": "proven", "k": "inst", "b": "hand cymbals and wooden clappers keeping a simple steady devotional pulse, bright small metal ringing on the accents with a dry wooden click between them, played by a group rather than one person so the timing is human and slightly spread, recorded close and dry with no reverb.", "neg": "It must not sound like a hi-hat or a tambourine, and never harsh or shrill.", "x": "-tinny -harsh -shrill -electronic -quantized -hi-hat -tambourine", "tip": "Layer under dholak. Never alone in a song."}, {"f": "perc", "g": "Desi", "n": "Damru", "d": "The small hourglass drum.", "t": "proven", "k": "inst", "b": "a small hourglass drum shaken so the knotted cords strike both heads, producing a rapid dry rattling pulse that rises and falls in speed, dark and ritual rather than musical, recorded very close and completely dry with no reverb and no pitch. This instrument is a damru.", "neg": "No melody, no reverb, nothing bright or electronic.", "x": "-tabla -melodic -reverb -electronic -bright -tinny", "tip": "Shiv material. Short bursts, never a full bar loop."}, {"f": "perc", "g": "Desi", "n": "Ghungroo", "d": "Ankle bells, dance.", "t": "describe", "k": "inst", "b": "dense clusters of small brass ankle bells struck by a dancer's feet, bright shimmering metallic rattles landing hard on the beat and ringing between beats, human and slightly uneven, recorded close in a wooden room. These are ghungroo.", "neg": "Not sleigh bells, not a tambourine, not a shaker, and never quantized.", "x": "-sleigh bells -tambourine -shaker -electronic -quantized -harsh", "tip": "Say ankle bells and dancer. Bells alone gets you Christmas."}, {"f": "perc", "g": "Orchestral", "n": "Timpani", "d": "Tuned low thunder.", "t": "solid", "k": "inst", "b": "solo timpani, deep tuned orchestral kettle drums struck with soft mallets, long rolling crescendos swelling from nothing and single low hits with enormous decay, grave and cinematic, recorded in a large hall with real tail.", "neg": "Not taiko, not a snare, nothing martial or fast.", "x": "-taiko -martial -military march -snare -fast -thin", "tip": ""}, {"f": "perc", "g": "Orchestral", "n": "Taiko", "d": "Huge, physical, wood.", "t": "solid", "k": "inst", "b": "solo taiko drums, enormous Japanese barrel drums struck with heavy wooden beaters, deep booming low end with the wood of the beater audible on every strike, a slow building pattern with long silences and hard accents, physical and ceremonial, in a big natural room.", "neg": "Not a drum kit, not electronic, never thin or busy.", "x": "-timpani -kit drums -electronic -thin -fast -busy", "tip": "Keep taiko off devotional work. Spectacle, not prayer."}, {"f": "perc", "g": "Orchestral", "n": "Cinematic low toms", "d": "Trailer floor.", "t": "solid", "k": "inst", "b": "solo low cinematic toms and floor percussion, deep sub heavy hits with tight decay played in a simple building pattern with long gaps, modern hybrid trailer production with huge low end and wide stereo.", "neg": "No cymbals at all, no hi-hat, no snare, nothing busy or bright.", "x": "-cymbals -hi-hat -snare -busy -fast -bright -acoustic kit", "tip": ""}, {"f": "perc", "g": "Kit", "n": "Warm acoustic kit", "d": "Real room, real player.", "t": "solid", "k": "inst", "b": "a solo acoustic drum kit played by a real drummer in a warm wooden room, round toms, a fat dry snare, soft ride and a kick with body rather than click, played with restraint and human swing with small timing imperfections left in, room mics prominent with natural decay.", "neg": "Nothing electronic, nothing quantized, no 808s and no gated reverb.", "x": "-electronic -quantized -808 -trap -gated reverb -thin -clicky kick", "tip": ""}, {"f": "perc", "g": "Kit", "n": "Brush kit", "d": "Soft, swept, jazz.", "t": "solid", "k": "inst", "b": "a solo drum kit played entirely with brushes, soft circular sweeps across the snare head with light accents, gentle ride taps and almost no , {"f": "keys", "g": "Vintage", "n": "Hammond organ", "d": "Drawbars and leslie.", "t": "solid", "k": "inst", "b": "a solo Hammond organ through a rotating speaker, warm drawbar tone with the leslie slowly turning, sustained chords with key click audible, gospel warmth without gospel showmanship, recorded in a real room.", "neg": "Not a synth, not a harmonium, nothing bright or distorted, no fast runs.", "x": "-synth -harmonium -bright -aggressive -fast runs -distorted", "tip": ""}, {"f": "keys", "g": "Texture", "n": "Ambient drone bed", "d": "Air under a scene.", "t": "solid", "k": "inst", "b": "a slowly evolving ambient drone bed, one sustained low chord with barely moving harmonic texture on top, very slow filter movement across a long span, wide stereo and deep low end, meditative and almost still.", "neg": "No melody, no rhythm, no percussion, no arpeggio and no builds.", "x": "-melody -rhythm -percussion -arpeggio -bright -EDM -builds", "tip": "Underscore for narration. Generate long, cut to length."}, {"f": "voiceM", "g": "Classical", "n": "Melismatic classical Indian male", "d": "Trained, ornamented, serious.", "t": "describe", "k": "voice", "b": "a trained Indian classical male vocal, rich and open throated in the middle and lower register, heavily melismatic with fast precise ornamentation, taans and gamaks turning tightly around each note, sliding between pitches with long continuous meend rather than stepping, the voice mature and weathered with real chest resonance, disciplined rather than emotional, every phrase beginning straight before the ornament arrives, clear Sanskrit and Hindi pronunciation, recorded close in a warm dry room with almost no reverb.", "neg": "No autotune, no pitch correction, nothing operatic, nothing belted, nothing thin or breathy.", "x": "-autotune -pitch corrected -western pop -operatic -soprano -belted -shouting -thin -breathy -falsetto -heavy reverb", "tip": "The ornament is the point. If it returns straight, push the taan a  Hum it, do not sing words. It is becoming an instrument anyway, and a hum keeps your actual voice out of it.\n3. Select the clip on the timeline.\n4. Switch this dashboard to CONVERT mode, pick your instrument, copy, paste into Studio Chat. Or right click the clip and use Cover with the same text.\n5. Two takes come back in the take lanes. Press 3, audition, commit.\n\nWATCH OUT: Cover always goes back to your ORIGINAL recording, even after you have already converted once. Recreate builds on the current version instead.", "neg": "", "x": "", "tip": "Melody and rhythm survive. Timbre is what changes."}, {"f": "move", "g": "Convert", "n": "Audio to MIDI, then re-play", "d": "When the notes need fixing first.", "t": "proven", "k": "move", "b": "RECIPE, not a prompt.\n\n1. Split the part out as a stem first. Never convert a full mix, the notes come back tangled because the mix is polyphonic.\n2. Right click the clip and transcribe it to MIDI.\n3. Fix the notes in the piano roll. Shift Q quantizes, arrows move and transpose, Z zooms to selection.\n4. Then either assign the Wavetable synth and describe a patch, or hand the MIDI clip to the model as the prompt and ask for a real performance of those notes on the instrument you name.\n\nUse this instead of Stem Cover whenever the melody itself is not right yet.", "neg": "", "x": "", "tip": "Cover keeps your performance. Audio to MIDI lets you rewrite it."}, {"f": "move", "g": "Convert", "n": "Change the singer on a line", "d": "Same words, different voice.", "t": "proven", "k": "move", "b": "RECIPE.\n\n1. Get the vocal on its own track, split from the mix if needed.\n2. Right click the clip header and Remove FX first if Suno baked reverb in.\n3. Select the clip.\n4. Switch to CONVERT mode, pick a voice from Voices Male or Voices Female, copy, paste into Studio Chat.\n\nThe melody and the words survive, the singer changes.\n\nWORTH KNOWING: anything you record or upload into Studio is covered by Suno's Content terms. A wordless hum is a smaller commitment than a full sung performance. Read suno.com/terms before you create a Voice Model.", "neg": "", "x": "", "tip": "The closest Studio gets to voice to voice without a Voice Model."}, {"f": "move", "g": "Fix", "n": "Get Dry, remove baked in FX", "d": "Strip Suno's reverb.", "t": "proven", "k": "move", "b": "RECIPE.\n\nRight click the clip HEADER and choose Remove FX. It strips reverb, delay and other effects baked into the generation and returns a dry version as a new take lane, auditioned automatically so you can compare before committing.\n\nDo this BEFORE adding any of your own space.", "neg": "", "x": "", "tip": "Always the first move on an imported Create vocal."}, {"f": "move", "g": "Fix", "n": "Advanced Split", "d": "Separate what Split from Mix cannot.", "t": "proven", "k": "move", "b": "RECIPE.\n\nRight click an audio clip. Split from Mix is the quick one. Advanced Split is the good one, and as of August 2026 it can separate instruments inside the same family, including an acoustic guitar from an electric guitar in the same take.\n\nDo not split everything by reflex. Split only what you intend to touch, then rebuild in your own DAW.", "neg": "", "x": "", "tip": "Split before audio to MIDI, always."}, {"f": "move", "g": "Chat", "n": "Arrangement commands", "d": "Mixing and shaping, in words.", "t": "proven", "k": "move", "b": "One instruction per message, or you will not know which half worked.\n\nGive me three alternate takes of the selected section.\n\nThin out the second verse. Mute everything except the drone and the lead vocal, then bring the full arrangement back at the chorus.\n\nDuck everything under the vocal by 4 dB and draw the automation so the dip follows the vocal phrases.\n\nCut this to a tight 25 second version. Hook, one verse, hook, hard stop, no fade.\n\nMake the last four bars end on a clean hit with no tail, so a voiceover can land on it.\n\nCarve 300 to 500 Hz out of the guitars so the vocal sits forward.\n\nSidechain the pad to the kick with a gentle pump, not an EDM pump.", "neg": "", "x": "", "tip": "Everything chat does is undoable with Cmd Z."}, {"f": "plug", "g": "Describe it, get it", "n": "Vocal de-esser", "d": "Tames sibilance. Split band.", "t": "solid", "k": "plugin", "b": "Build me a vocal de-esser plugin for taming harsh sibilance (s, t, sh, z sounds) in vocal tracks. It should use a frequency-targeted sidechain approach, not just broadband compression. Key parameters I want: Frequency knob (2 kHz to 12 kHz range) to dial in where the sibilance lives, defaulting around 6-7 kHz. Threshold control that sets how loud the sibilant frequencies need to be before reduction kicks in. Reduction knob to control how much gain reduction is applied. Mode toggle between split-band (only reduces the targeted frequency range) and wideband (ducks the entire signal), with split-band as the default since it is more transparent. Attack and Release controls, fast attack and medium release as defaults. Listen/Monitor button that solos just the sidechain detection frequency so I can dial the frequency knob accurately. The visual display should show the frequency detection range highlighted and real-time gain reduction metering. Include every element listed above.", "neg": "", "x": "", "tip": "Paste into Studio Chat. If it skips the meters, say redo the plugin and include the meters I asked for."}, {"f": "plug", "g": "Describe it, get it", "n": "Tape saturation", "d": "Analog warmth, not distortion.", "t": "solid", "k": "plugin", "b": "Build me a tape saturation and analog warmth plugin that emulates the subtle harmonic coloring, gentle compression, and high-frequency softening of recording to analog tape. Musical and warm, not distorted or aggressive. Parameters: Drive/Input Gain controlling how hard the signal hits the virtual tape, smooth and gradual, never harsh. Tape Speed toggle between 15 IPS (more low-end warmth, earlier high-frequency rolloff) and 30 IPS (cleaner, more open). Saturation Color knob blending even-order harmonics (warmer, tube-like) and odd-order (grittier), defaulting mostly even. High Frequency Rolloff knob from subtle silk to vintage dulling. Compression knob emulating tape soft-knee behaviour. Noise knob for optional hiss, defaulting to off or very low. Mix dry/wet for parallel processing. Display the saturation curve responding in real time plus a VU-style meter. Include every element listed above.", "neg": "", "x": "", "tip": "Paste into Studio Chat. If it skips the meters, say redo the plugin and include the meters I asked for."}, {"f": "plug", "g": "Describe it, get it", "n": "Temple room reverb", "d": "Stone, dark, ancient.", "t": "solid", "k": "plugin", "b": "Build me a convolution-style reverb voiced for a stone temple interior, long, dark and diffuse, with the early reflections of a hard-walled hall and almost no bright top end. It must sound ancient and roomy, never like a modern plate or a bright digital hall. Parameters: Size knob from small shrine to large hall, defaulting to large. Decay 1 to 8 seconds, defaulting to 3.5. Pre-delay 0 to 120 ms, defaulting to 40 ms so the words stay intelligible. Damping that rolls off highs in the tail, defaulting high so the tail goes dark rather than hissy. Low Cut on the reverb send, 20 to 300 Hz, defaulting to 120 Hz so the tail never muddies the tabla and bass. Width from mono to wide, defaulting narrow. Mix dry/wet defaulting to 18 percent. Display the impulse response tail decaying. Include every element.", "neg": "", "x": "", "tip": "Paste into Studio Chat. If it skips the meters, say redo the plugin and include the meters I asked for."}, {"f": "plug", "g": "Describe it, get it", "n": "Vocal air and presence", "d": "Finishing EQ for a close Hindi vocal.", "t": "solid", "k": "plugin", "b": "Build me a vocal-finishing EQ that adds air and forward presence to a close-mic Hindi playback vocal without making it harsh or sibilant. Parameters: Air knob, a gentle hig function build(it,mode){
  mode=mode||MODE;
  if(it.k==="move"||it.k==="plugin"||it.k==="synth") return it.b;
  const V=it.k==="voice";
  if(mode==="convert"){
    const keep = V ? " Keep the melody, the words and the timing exactly as they are. Change only the singer."
                   : " Keep the melody, the rhythm and the phrasing exactly as they are, and render it as this one instrument on its own.";
    return "Convert the selected clip to "+it.b+keep+(it.neg?" "+it.neg:"");
  }
  if(mode==="generate"){
    const fit = V ? " Write it to sit in the key and tempo of the project and to follow the existing arrangement."
                  : " Lock it to the tempo and key of the project, let it sit with what is already playing, and keep it to this one instrument on its own.";
    return "Add a new track and generate "+it.b+fit+(it.neg?" "+it.neg:"");
  }
  const solo = V ? " One voice alone." : " One instrument alone, no other instruments and no vocals.";
  return cap(it.b)+solo;

     +'<button class="copy" data-c="x">copy</button></div><pre>'+esc(i.x)+'</pre></div>'
     +'<div class="block"><div class="bhead"><span class="blabel">both together</span>'
     +'<button class="copy" data-c="b">copy</button></div><pre>'+esc(txt+"\n\nExclude: "+i.x)+'</pre></div>';
  }
  h+='<button class="tbtn" data-fav="1" style="margin-top:.3rem">'+(FAVS.includes(k)?"★ remove from favourites":"☆ add to favourites")+'</button>';
  $("#dbody").innerHTML=h;
  $("#detail").classList.add("open"); document.body.classList.add("dopen");
  $("#dbody").querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    copy(b.dataset.c==="p"?txt:b.dataset.c==="x"?i.x:(txt+"\n\nExclude: "+i.x),b)});
  const fb=$("#dbody").querySelector("[data-fav]"); if(fb) fb.onclick=()=>{toggleFav(k);open(k)};
  document.querySelectorAll(".card").forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===CUR));
}
function toggleFav(k){
  const i=FAVS.indexOf(k); if(i>=0) FAVS.splice(i,1); else FAVS.push(k);
  try{localStorage.setItem("s10a_pm_favs",JSON.stringify(FAVS))}catch(e){}
  const c=CUR; render(); CUR=c;
  document.querySelectorAll(".card").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===CUR));
}
function favs(){
  const w=$("#favwrap");
  const items=FAVS.map(k=>DATA.items.find(x=>key(x)===k)).filter(Boolean);
  $("#favhint").textContent = items.length ? items.length+" pinned · copies in "+MODES[MODE].label.toLowerCase()+" form"
                                           : "star anything to pin it here";
  if(!items.length){ w.innerHTML='<div class="favempty">nothing pinned yet - tap ☆ on any card</div>'; return }
  w.innerHTML=items.map(i=>'<div class="fav" style="--fh:'+hue(i.f)+'">'
    +'<span data-open="'+esc(key(i))+'">'+esc(i.n)+'</span>'
    +'<button class="fc" data-copy="'+esc(key(i))+'">copy</button>'
    +'<button class="fx" data-un="'+esc(key(i))+'">×</button></div>').join("");
  w.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>open(e.dataset.open));
  w.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const i=DATA.items.find(x=>key(x)===b.dataset.copy); copy(build(i),b)});
  w.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.un));
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  MODE=b.dataset.m; try{localStorage.setItem("s10a_pm_mode",MODE)}catch(e){}
  const c=CUR; render(); if(c&&DATA.items.find(x=>key(x)===c&&modeOK(x,MODE))) open(c);
  else { CUR=null; $("#dbody").innerHTML=HOME }
});
$("#q").addEventListener("input",e=>{Q=e.target.value.trim().toLowerCase();GRP="all";render()});
$("#themeBtn").onclick=()=>{const d=document.documentElement;
  const now=d.dataset.theme==="light"?"dark":"light"; d.dataset.theme=now;
  try{localStorage.setItem("s10a_pm_theme",now)}catch(e){}};
$("#dclose").onclick=()=>{$("#detail").classList.remove("open");document.body.classList.remove("dopen")};
$("#favtoggle").onclick=()=>{const d=$("#favdock"); d.classList.toggle("closed");
  $("#favtoggle").textContent=d.classList.contains("closed")?"show":"hide"};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape"){$("#detail").classList.remove("open");document.body.classList.remove("dopen")}
});
render();
$("#dbody").innerHTML='<div class="welcome"><p class="w1">My working prompts for Suno Studio. Suno had no idea what a sarangi sounds like, so the Indian instrument ones took the most tries to get right.</p><p class="w2">Take what you need. Nothing to sign up for, nothing to buy.</p><p class="w3">We build these for our own sessions and then hand them out, because sharing sounds better.</p><p class="w4">Pick a family on the left. Every prompt copies in whichever mode you have chosen at the top, and the ones you star pin to the bar at the bottom.</p></div>';

/* ---- getting back to the start ---- */
const HOME=$("#dbody").innerHTML;
function softReset(){
  FAM=DATA.fams[0][0]; GRP="all"; Q=""; CUR=null;
  $("#q").value="";
  render();
  $("#dbody").innerHTML=HOME;
  $("#detail").classList.remove("open"); document.body.classList.remove("dopen");
  $("#list").scrollTop=0; $("#rail").scrollTop=0;
}
$("#home").onclick=softReset;
$("#clearBtn").onclick=softReset;
$("#resetBtn").onclick=()=>{
  if(!confirm("Reset everything?\n\nThis clears your starred favourites, the chosen mode and the theme. The prompts themselves are untouched.")) return;
  try{["s10a_pm_favs","s10a_pm_theme","s10a_pm_mode"].forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
};
</script>
